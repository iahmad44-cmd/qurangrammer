<!doctype html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quran Grammar — Lisan ul Quran study notes</title>
  <meta name="description" content="Detailed Urdu and English study notes on Arabic grammar from the Lisan ul Quran course.">
  <meta name="theme-color" content="#0F4C46">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lora:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#lessons">Skip to lessons</a>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand" aria-labelledby="site-title">
        <p class="eyebrow">Lisan ul Quran · لسان القرآن</p>
        <h1 id="site-title">Quran Grammar</h1>
        <p id="site-description" class="description">عربی قواعد کے تفصیلی مطالعے کے نوٹس · اسباق ۱ تا ۱۷</p>
      </div>
      <div class="language-switch" role="group" aria-label="Choose language">
        <button type="button" data-lang="ur" aria-pressed="true">اردو</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
    </div>
  </header>

  <main>
    <section class="toolbar" aria-labelledby="library-title">
      <div>
        <p id="library-kicker" class="section-kicker">مطالعہ کا ذخیرہ</p>
        <h2 id="library-title">تمام اسباق</h2>
      </div>
      <div class="search-wrap">
        <label id="search-label" for="search">اسباق تلاش کریں</label>
        <input id="search" type="search" autocomplete="off" placeholder="عنوان یا موضوع لکھیں…">
      </div>
    </section>

    <p id="availability-note" class="availability-note" role="note"></p>
    <p id="result-count" class="result-count" aria-live="polite"></p>
    <ol id="lessons" class="lesson-list" aria-labelledby="library-title"></ol>
    <p id="empty-state" class="empty-state" hidden>کوئی سبق نہیں ملا۔</p>
  </main>

  <footer>
    <p class="dua" lang="ar" dir="rtl">رَبِّ زِدْنِيْ عِلْمًا</p>
    <p id="footer-text">اے میرے رب، میرے علم میں اضافہ فرما۔</p>
  </footer>
</body>
</html>
